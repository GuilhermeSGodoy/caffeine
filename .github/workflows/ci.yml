name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - name: Testes e cobertura (Caffeine.Domain)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          dotnet test Caffeine.Tests/Caffeine.Tests.csproj --no-build --configuration Release -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura 2>&1 | Tee-Object -FilePath test-output.txt
          $exitCode = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '### Backend — testes e cobertura (`Caffeine.Domain`)'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```text'
          Get-Content test-output.txt | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value '```'
          exit $exitCode

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx ng build
      - name: Testes e cobertura
        env:
          FORCE_COLOR: '0'
        run: |
          npx ng test --watch=false --configuration=ci 2>&1 | tee test-output.txt || true
          exit_code=${PIPESTATUS[0]}
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' test-output.txt > test-output-clean.txt
          {
            echo '### Frontend — cobertura'
            echo '```text'
            awk '/Coverage report from/,/^=+$/' test-output-clean.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instala dependências do frontend
        working-directory: src/frontend
        run: npm ci
      - name: Instala browsers do Playwright
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium
      - name: Sobe o backend em background
        working-directory: src/backend/Caffeine.Api
        run: dotnet run --configuration Release &
        env:
          CAFFEINE_API_URL: http://127.0.0.1:5000
          CAFFEINE_DATA_DIR: ${{ runner.temp }}/caffeine-e2e-data
      - name: Sobe o frontend em background
        working-directory: src/frontend
        run: npx ng serve &
      - name: Espera backend e frontend responderem
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:5000/api/nodes/tree && echo "backend up" && break
            sleep 2
          done
          curl -s -o /dev/null http://127.0.0.1:5000/api/nodes/tree || { echo "backend não respondeu a tempo"; exit 1; }
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:4200 && echo "frontend up" && break
            sleep 3
          done
          curl -s -o /dev/null http://localhost:4200 || { echo "frontend não respondeu a tempo"; exit 1; }
      - name: Executa os testes E2E (Playwright)
        working-directory: src/frontend
        run: |
          npm run e2e 2>&1 | tee e2e-output.txt || true
          exit_code=${PIPESTATUS[0]}
          sed -E 's/\x1b\[[0-9;]*[a-zA-Z]//g' e2e-output.txt > e2e-output-clean.txt
          {
            echo '### E2E (Playwright)'
            echo '```text'
            cat e2e-output-clean.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
      - name: Publica relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/frontend/test-results/
          retention-days: 7
