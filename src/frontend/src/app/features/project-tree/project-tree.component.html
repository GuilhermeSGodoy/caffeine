<div class="project-tree">
  <div class="project-tree__toolbar">
    <span>Projetos</span>
    <p-button icon="pi pi-plus" size="small" severity="secondary" [text]="true" (onClick)="createRootFolder()" />
  </div>

  <p-tree
    [value]="store.treeNodes()"
    selectionMode="single"
    [(selection)]="selectedNode"
    [contextMenu]="menu"
    (onNodeSelect)="onNodeSelect($event)"
    (onNodeExpand)="onNodeExpand($event)"
    (onNodeCollapse)="onNodeCollapse($event)"
    class="project-tree__tree"
  />

  <p-contextMenu #menu [model]="contextMenuItems" />

  <div class="project-tree__footer">
    <p-button
      icon="pi pi-cog"
      severity="secondary"
      [text]="true"
      [style]="{ fontSize: '1.75rem', width: '2.75rem', height: '2.75rem' }"
      (onClick)="openSettings()"
    />
  </div>
</div>

<app-settings-dialog [visible]="settingsVisible" (visibleChange)="settingsVisible = $event" />
